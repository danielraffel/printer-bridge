name: PrinterBridge
options:
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.44.0
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  PrinterBridgeCore:
    path: ../../packages/core
targets:
  PrinterBridgeApp:
    type: application
    platform: macOS
    sources:
      - path: PrinterBridgeApp/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielraffel.printerbridge
        PRODUCT_NAME: PrinterBridge
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PrinterBridge
        INFOPLIST_KEY_LSMinimumSystemVersion: "15.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: NO
    dependencies:
      - package: PrinterBridgeCore
        product: PrinterBridgeCore
  PrinterBridgeDaemon:
    type: tool
    platform: macOS
    sources:
      - path: PrinterBridgeDaemon/Sources
    settings:
      base:
        PRODUCT_NAME: PrinterBridgeDaemon
        SKIP_INSTALL: YES
    dependencies:
      - package: PrinterBridgeCore
        product: PrinterBridgeCore
  PrinterBridgeCLI:
    type: tool
    platform: macOS
    sources:
      - path: PrinterBridgeCLI/Sources
    settings:
      base:
        PRODUCT_NAME: PrinterBridgeCLI
        SKIP_INSTALL: YES
    dependencies:
      - package: PrinterBridgeCore
        product: PrinterBridgeCore
schemes:
  PrinterBridge:
    build:
      targets:
        PrinterBridgeApp: all
        PrinterBridgeDaemon: all
  PrinterBridgeDev:
    build:
      targets:
        PrinterBridgeApp: all
        PrinterBridgeDaemon: all
        PrinterBridgeCLI: all
  PrinterBridgeCLI:
    build:
      targets:
        PrinterBridgeCLI: all
