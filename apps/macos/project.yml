name: PrinterBridge
options:
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.44.0
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
      ENABLE_HARDENED_RUNTIME: YES
packages:
  PrinterBridgeCore:
    path: ../../packages/core
targets:
  PrinterBridgeApp:
    type: application
    platform: macOS
    sources:
      - path: PrinterBridgeApp/Sources
      - path: PrinterBridgeApp/Resources
        buildPhase: resources
      - path: ../../docs/legal
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielraffel.printerbridge
        PRODUCT_NAME: "Printer Bridge"
        EXECUTABLE_NAME: PrinterBridge
        WRAPPER_NAME: "Printer Bridge.app"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Printer Bridge"
        INFOPLIST_KEY_CFBundleName: "Printer Bridge"
        INFOPLIST_KEY_LSMinimumSystemVersion: "15.0"
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.1.2
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: NO
    dependencies:
      - package: PrinterBridgeCore
        product: PrinterBridgeCore
  PrinterBridgeDaemon:
    type: tool
    platform: macOS
    sources:
      - path: PrinterBridgeDaemon/Sources
    settings:
      base:
        PRODUCT_NAME: "Printer Bridge Daemon"
        EXECUTABLE_NAME: "Printer Bridge Daemon"
        SKIP_INSTALL: YES
    dependencies:
      - package: PrinterBridgeCore
        product: PrinterBridgeCore
  PrinterBridgeCLI:
    type: tool
    platform: macOS
    sources:
      - path: PrinterBridgeCLI/Sources
    settings:
      base:
        PRODUCT_NAME: PrinterBridgeCLI
        SKIP_INSTALL: YES
    dependencies:
      - package: PrinterBridgeCore
        product: PrinterBridgeCore
schemes:
  PrinterBridge:
    build:
      targets:
        PrinterBridgeApp: all
        PrinterBridgeDaemon: all
  PrinterBridgeDev:
    build:
      targets:
        PrinterBridgeApp: all
        PrinterBridgeDaemon: all
        PrinterBridgeCLI: all
  PrinterBridgeCLI:
    build:
      targets:
        PrinterBridgeCLI: all
