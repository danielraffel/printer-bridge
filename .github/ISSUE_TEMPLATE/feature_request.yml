name: Feature request
description: Suggest an improvement for Printer Bridge
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you are trying to solve and the change you would like to see.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: Tell us what is missing or frustrating today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      placeholder: Describe the feature or behavior you want.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Add any examples, screenshots, or supporting details here.
